%YAML:1.0 # need to specify the file type at the top!

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

# Bag playback settings
bag_realtime_factor: 0.0 # 0=disabled (fast as possible), 1.0=real-time, 2.0=2x speed

use_fej: true # if first-estimate Jacobians should be used (enable for good consistency)
integration: "rk4" # discrete, rk4, analytical (if rk4 or analytical used then analytical covariance propagation is used)
use_stereo: false # if we have more than 1 camera, if we should try to track stereo constraints between pairs
max_cameras: 1 # how many cameras we have 1 = mono, 2 = stereo, >2 = binocular (all mono tracking)

calib_cam_extrinsics: true # if the transform between camera and IMU should be optimized R_ItoC, p_CinI
calib_cam_intrinsics: true # if camera intrinsics should be optimized (focal, center, distortion)
calib_cam_timeoffset: true # if timeoffset between camera and IMU should be optimized
calib_imu_intrinsics: false # if imu intrinsics should be calibrated (rotation and skew-scale matrix)
calib_imu_g_sensitivity: false # if gyroscope gravity sensitivity (Tg) should be calibrated

max_clones: 11 # how many clones in the sliding window
max_slam: 50 # number of features in our state vector
max_slam_in_update: 25 # update can be split into sequential updates of batches, how many in a batch
max_msckf_in_update: 40 # how many MSCKF features to use in the update
dt_slam_delay: 1 # delay before initializing (helps with stability from bad initialization...)
auto_reset_interval: 10.0 # >0 resets periodically; each segment has its own local frame (0 disables reset)

gravity_mag: 9.81 # magnitude of gravity in this location

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update parameters we can use
# we support either IMU-based or disparity detection.
try_zupt: false
zupt_chi2_multipler: 0 # set to 0 for only disp-based
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5 # set to 0 for only imu-based
zupt_only_at_beginning: false

# ==================================================================
# ==================================================================

init_window_time: 0.5 # how many seconds to collect initialization information
init_imu_thresh: 1.5 # threshold for variance of the accelerometer to detect a "jerk" in motion
init_max_disparity: 20.0 # require enough image motion before learned initialization (resolution dependent)
init_max_features: 200 # how many features to track during initialization (saves on computation)

init_mode: "vggt_pt" # one of: static / dynamic / vggt_pt
init_dyn_mle_opt_calib: false # if we should optimize calibration during intialization (not recommended)
init_dyn_mle_max_iter: 100 # how many iterations the MLE refinement should use (zero to skip the MLE)
init_dyn_mle_max_time: 0.5 # how many seconds the MLE should be completed in
init_dyn_mle_max_threads: 6 # how many threads the MLE should use
init_dyn_num_pose: 5 # number of poses to use within our window time (evenly spaced)
init_dyn_min_deg: 5.0 # orientation change needed to try to init

init_dyn_inflation_ori: 10 # what to inflate the recovered q_GtoI covariance by
init_dyn_inflation_vel: 100 # what to inflate the recovered v_IinG covariance by
init_dyn_inflation_bg: 10 # what to inflate the recovered bias_g covariance by
init_dyn_inflation_ba: 100 # what to inflate the recovered bias_a covariance by
init_dyn_min_rec_cond: 1e-12 # reciprocal condition number thresh for info inversion

init_dyn_bias_g: [ -0.0022, 0.0216, 0.0783 ] # initial gyroscope bias guess
init_dyn_bias_a: [ -0.0358, -0.0005, 0.0145 ] # initial accelerometer bias guess
init_dyn_max_nonlinear_avg_residual: 0.065 # DYNAMIC and vggt_pt SC/FEATURE_ONLY; inactive in this FF configuration

# VGGT INITIALIZATION ================================
init_vggt_use_pointcloud: true # required by vggt_pt
init_vggt_points_per_frame: 100
init_vggt_wait_timeout: 30.0 # seconds to wait for point-cloud responses, including slow model inference
vggt_target_size: 518 # processed-image target width
init_vggt_use_confidence_filter: true # if confidence filtering should be applied to model point clouds
init_vggt_confidence_threshold: 1.2 # points below this value are marked invalid

# Scale optimization parameters for VGGT initialization
# Method: FF = selector true + weight 0; SC = selector false + weight >0.
init_vggt_use_scale_optimization: true # legacy selector; true selects FF
init_vggt_scale_region_n: 3 # scale layout: 0 = global, n > 0 = n×n regions along PCA principal axes
init_vggt_scale_smoothness_weight: 30.0 # weight for adjacent-region scale smoothness (0 = no constraint)
init_vggt_scale_use_softplus: true # use softplus parameterization for scale (ensures scale > 0)
init_vggt_scale_prior_weight: 5.0 # weight for scale prior constraint
init_vggt_scale_sigma_pix: 1 # FF reprojection pixel sigma
init_vggt_feature_pc_constraint_weight: 0.0 # FF requires 0; a positive value is SC-only

# Residual rejection parameters
init_vggt_max_linear_avg_residual: 0.06 # max linear system residual to accept (0 = disabled)
init_vggt_max_nonlinear_avg_residual: 0.6 # effective FF threshold (0 = disabled)
init_vggt_max_scale_std: 0.5 # max FF regional scale standard deviation (0 = disabled)

# RANSAC parameters for VGGT initialization
init_vggt_use_ransac: true # enable RANSAC for robust initialization
init_vggt_ransac_max_iterations: 200 # maximum RANSAC iterations
init_vggt_ransac_inlier_threshold: 0.01 # inlier threshold in pixels
init_vggt_ransac_min_inlier_ratio: 0.5 # minimum inlier ratio to accept result
init_vggt_ransac_min_sample_size: 10 # minimum sample size (-1 for auto)

init_vggt_fisheye_fov_scale: 0.15 # FOV scale for fisheye undistortion (not used for pinhole cameras)
init_vggt_crop_to_4_3: 0 # crop fisheye image height to 4:3 aspect ratio (0 for non-fisheye cameras)

# ==================================================================
# ==================================================================

record_timing_information: false # if we want to record timing information of the method
record_timing_filepath: "output/Euroc/V1_01/traj_timing.txt" # https://docs.openvins.com/eval-timing.html#eval-ov-timing-flame

# if we want to save the estimated trajectory
save_total_state: true
save_total_state_tum: true
filepath_est: "output/Euroc/V1_01/trajectory.tum"
# ==================================================================
# ==================================================================

# our front-end feature tracking parameters
# we have a KLT and descriptor based (KLT is better implemented...)
use_klt: true # if true we will use KLT, otherwise use a ORB descriptor + robust matching
num_pts: 200 # number of points (per camera) we will extract and try to track
fast_threshold: 20 # threshold for fast extraction (warning: lower threshs can be expensive)
grid_x: 5 # extraction sub-grid count for horizontal direction (uniform tracking)
grid_y: 5 # extraction sub-grid count for vertical direction (uniform tracking)
min_px_dist: 10 # distance between features (features near each other provide less information)
knn_ratio: 0.70 # descriptor knn threshold for the top two descriptor matches
track_frequency: 21.0 # frequency we will perform feature tracking at (in frames per second / hertz)
downsample_cameras: false # will downsample image in half if true
num_opencv_threads: 4 # -1: auto, 0-1: serial, >1: number of threads
histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE

# Visualization parameters
viz_font_scale: 1.2       # overlay text size (small mode auto ×0.67)
viz_font_thickness: 2     # overlay text thickness
viz_image_scale: 1.5      # rviz published image scale factor

# aruco tag tracker for the system
# DICT_6X6_1000 from https://chev.me/arucogen/
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

# camera noises and chi-squared threshold multipliers
up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

# masks for our images
use_mask: false

# imu and camera spacial-temporal
# imu config should also have the correct noise values
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"

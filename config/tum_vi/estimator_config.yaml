%YAML:1.0 # need to specify the file type at the top!

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

# Bag playback settings
bag_realtime_factor: 0.0 # 0=disabled (fast as possible), 1.0=real-time, 2.0=2x speed

use_fej: true # if first-estimate Jacobians should be used (enable for good consistency)
integration: "rk4" # discrete, rk4, analytical (if rk4 or analytical used then analytical covariance propagation is used)
use_stereo: false # if we have more than 1 camera, if we should try to track stereo constraints
max_cameras: 1 # how many cameras we have 1 = mono, 2 = stereo, >2 = binocular (all mono tracking)

calib_cam_extrinsics: true
calib_cam_intrinsics: true
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 2
auto_reset_interval: 10.0 # >0 resets periodically; each segment has its own local frame (0 disables reset)

gravity_mag: 9.80766

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update parameters we can use
# we support either IMU-based or disparity detection.
try_zupt: false
zupt_chi2_multipler: 0 # set to 0 for only disp-based
zupt_max_velocity: 0.1
zupt_noise_multiplier: 50
zupt_max_disparity: 2.0 # set to 0 for only imu-based
zupt_only_at_beginning: true

# ==================================================================
# ==================================================================

init_window_time: 0.5 # make 2sec if using dynamic...
init_imu_thresh: 0.45 # room1-5:0.45, room6:0.25
init_max_disparity: 15.0
init_max_features: 50

init_mode: "vggt_pt" # one of: static / dynamic / vggt_pt
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 100
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 5
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]
init_dyn_max_nonlinear_avg_residual: 0 # DYNAMIC and vggt_pt SC/FEATURE_ONLY; inactive in this FF configuration

# VGGT INITIALIZATION ================================
init_vggt_use_pointcloud: true # required by vggt_pt
init_vggt_points_per_frame: 100
init_vggt_wait_timeout: 30.0 # seconds to wait for point-cloud responses, including slow model inference
vggt_target_size: 518 # processed-image target width
init_vggt_use_confidence_filter: true # if confidence filtering should be applied to model point clouds
init_vggt_confidence_threshold: 1.1 # points below this value are marked invalid

# Scale optimization parameters for VGGT initialization
# Method: FF = selector true + weight 0; SC = selector false + weight >0.
init_vggt_use_scale_optimization: true # legacy selector; true selects FF
init_vggt_scale_region_n: 3 # scale layout: 0 = global, n > 0 = n×n regions along PCA principal axes
init_vggt_scale_smoothness_weight: 100.0 # weight for adjacent-region scale smoothness (0 = no constraint)
init_vggt_scale_use_softplus: true # use softplus parameterization for scale (ensures scale > 0)
init_vggt_scale_prior_weight: 0 # weight for scale prior constraint
init_vggt_scale_sigma_pix: 1.0 # FF reprojection pixel sigma
init_vggt_feature_pc_constraint_weight: 0.0 # FF requires 0; a positive value is SC-only

# Residual rejection parameters
init_vggt_max_linear_avg_residual: 0.1 # max linear system residual to accept (0 = disabled)
init_vggt_max_nonlinear_avg_residual: 0.55 # effective FF threshold (0 = disabled)
init_vggt_max_scale_std: 0.5 # max FF regional scale standard deviation (0 = disabled)

# RANSAC parameters for VGGT initialization
init_vggt_use_ransac: true # enable RANSAC for robust initialization
init_vggt_ransac_max_iterations: 200 # maximum RANSAC iterations
init_vggt_ransac_inlier_threshold: 0.03 # inlier threshold in pixels
init_vggt_ransac_min_inlier_ratio: 0.5 # minimum inlier ratio to accept result
init_vggt_ransac_min_sample_size: 10 # minimum sample size (-1 for auto)

init_vggt_fisheye_fov_scale: 0.2
init_vggt_crop_to_4_3: 1  # crop fisheye image height to 4:3 aspect ratio

# ==================================================================
# ==================================================================

record_timing_information: false
record_timing_filepath: "output/TUM_VI/traj_timing.txt"

save_total_state: true
save_total_state_tum: true
filepath_est: "output/TUM_VI/room1/trajectory.tum"

# ==================================================================
# ==================================================================

# our front-end feature tracking parameters
# we have a KLT and descriptor based (KLT is better implemented...)
use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.65
track_frequency: 21.0
downsample_cameras: false
num_opencv_threads: 4 # -1: auto, 0-1: serial, >1: number of threads
histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE

# Visualization parameters
viz_font_scale: 2       # overlay text size (small mode auto ×0.67)
viz_font_thickness: 2     # overlay text thickness
viz_image_scale: 1.5      # rviz published image scale factor

# aruco tag tracker for the system
# DICT_6X6_1000 from https://chev.me/arucogen/
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

# camera noises and chi-squared threshold multipliers
up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

# masks for our images
use_mask: true
mask0: "mask_tumvi0_1024.png" #relative to current file
mask1: "mask_tumvi1_1024.png" #relative to current file

# imu and camera spacial-temporal
# imu config should also have the correct noise values
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain_1024.yaml"
